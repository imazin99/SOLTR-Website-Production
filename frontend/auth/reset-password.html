<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLTR — Reset Password</title>
<meta name="description" content="Choose a new password for your SOLTR account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/style.css">
<style>
  body { overflow-y: auto; }
  .login-screen {
    position: static;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    padding: 60px 20px;
    box-sizing: border-box;
  }
</style>
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>

<div class="login-screen" id="loginScreen">

  <!-- decorative watermark -->
  <div class="login-bg-text" aria-hidden="true">SOLTR</div>

  <div class="login-card" id="loginCard">

    <!-- brand -->
    <div class="login-brand">
      <span class="login-gothic">S.</span>
      <div>
        <div class="login-title">SOLTR</div>
        <div class="login-sub">Reset Password</div>
      </div>
    </div>

    <h1 class="login-heading">Choose a new password.</h1>
    <p class="login-desc" id="pageDesc">Enter a new password for your account below.</p>

    <!-- success state -->
    <div class="login-error" id="successBanner" style="display:none; color:var(--bone); border-color:var(--line); background:var(--black-3); margin-bottom:18px;">
      Password reset successfully. Redirecting you to login…
    </div>

    <!-- invalid/missing token state -->
    <div class="login-error" id="invalidTokenBanner" style="display:none; margin-bottom:18px;">
      This reset link is invalid or has expired. Please request a new one.
    </div>

    <!-- form -->
    <form class="login-form" id="resetForm" novalidate>

      <div class="field-group">
        <label class="field-label" for="newPassword">New Password</label>
        <div style="position:relative;">
          <input
            class="field-input"
            type="password"
            id="newPassword"
            name="password"
            placeholder="••••••••"
            autocomplete="new-password"
            required
            style="padding-right:48px;"
          >
          <button
            type="button"
            id="togglePassword"
            aria-label="Toggle password visibility"
            style="
              position:absolute; right:14px; top:50%; transform:translateY(-50%);
              font-family:var(--mono); font-size:10px; text-transform:uppercase;
              letter-spacing:.06em; color:var(--smoke); background:none; border:none; cursor:pointer;
            "
          >SHOW</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="confirmPassword">Confirm New Password</label>
        <input
          class="field-input"
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
          required
        >
      </div>

      <!-- error message -->
      <div class="login-error" id="resetError" role="alert" aria-live="assertive"></div>

      <button class="login-btn" type="submit" id="submitBtn">
        Reset Password →
      </button>

    </form>

    <!-- back link -->
    <div style="margin-top:22px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--smoke);">
      <a href="customer-login.html" style="color:var(--bone); text-decoration:underline;">Back to login</a>
    </div>

  </div>
</div>

<script src="../js/config.js"></script>
<script>
  const API = window.SOLTR_CONFIG.API;
  const MIN_PASSWORD_LENGTH = 8;

  const token = new URLSearchParams(window.location.search).get('token');

  const form       = document.getElementById('resetForm');
  const invalidEl  = document.getElementById('invalidTokenBanner');
  const pageDesc   = document.getElementById('pageDesc');

  /* No token in the URL at all — don't even show the form. */
  if (!token) {
    form.style.display = 'none';
    pageDesc.style.display = 'none';
    invalidEl.style.display = 'block';
  }

  /* ── Show / hide password ── */
  const pwdInput  = document.getElementById('newPassword');
  const toggleBtn = document.getElementById('togglePassword');
  toggleBtn.addEventListener('click', () => {
    const isText = pwdInput.type === 'text';
    pwdInput.type = isText ? 'password' : 'text';
    toggleBtn.textContent = isText ? 'SHOW' : 'HIDE';
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const password        = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorEl    = document.getElementById('resetError');
    const successEl  = document.getElementById('successBanner');
    const submitBtn  = document.getElementById('submitBtn');
    const card       = document.getElementById('loginCard');

    errorEl.classList.remove('show');

    if (password.length < MIN_PASSWORD_LENGTH) {
      errorEl.textContent = `Password must be at least ${MIN_PASSWORD_LENGTH} characters.`;
      errorEl.classList.add('show');
      return;
    }
    if (password !== confirmPassword) {
      errorEl.textContent = 'Passwords do not match.';
      errorEl.classList.add('show');
      return;
    }

    submitBtn.classList.add('loading');

    try {
      const res  = await fetch(`${API}/customers/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json().catch(() => ({}));

      submitBtn.classList.remove('loading');

      if (res.ok) {
        form.style.display = 'none';
        successEl.textContent = data.message || 'Password reset successfully. Redirecting you to login…';
        successEl.style.display = 'block';
        setTimeout(() => { window.location.href = 'customer-login.html'; }, 2500);
      } else {
        errorEl.textContent = data.message || 'This reset link is invalid or has expired. Please request a new one.';
        errorEl.classList.add('show');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
    } catch (err) {
      submitBtn.classList.remove('loading');
      errorEl.textContent = 'Could not reach the server. Please try again.';
      errorEl.classList.add('show');
    }
  });
</script>
  <script src="../js/theme.js"></script>
</body>
</html>
