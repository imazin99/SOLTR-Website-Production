<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLTR — Forgot Password</title>
<meta name="description" content="Reset your SOLTR account password.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { overflow-y: auto; }
  .login-screen {
    position: static;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    padding: 60px 20px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">

  <!-- decorative watermark -->
  <div class="login-bg-text" aria-hidden="true">SOLTR</div>

  <div class="login-card" id="loginCard">

    <!-- brand -->
    <div class="login-brand">
      <span class="login-gothic">S.</span>
      <div>
        <div class="login-title">SOLTR</div>
        <div class="login-sub">Forgot Password</div>
      </div>
    </div>

    <h1 class="login-heading">Reset your password.</h1>
    <p class="login-desc">Enter the email on your account and we'll send you a link to choose a new password.</p>

    <!-- success state -->
    <div class="login-error" id="successBanner" style="display:none; color:var(--bone); border-color:var(--line); background:var(--black-3); margin-bottom:18px;">
      If an account with that email exists, a password reset link has been sent.
    </div>

    <!-- form -->
    <form class="login-form" id="forgotForm" novalidate>

      <div class="field-group">
        <label class="field-label" for="forgotEmail">Email</label>
        <input
          class="field-input"
          type="email"
          id="forgotEmail"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <!-- error message -->
      <div class="login-error" id="forgotError" role="alert" aria-live="assertive"></div>

      <button class="login-btn" type="submit" id="submitBtn">
        Send Reset Link →
      </button>

    </form>

    <div style="margin-top:22px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--smoke);">
      Remembered it? <a href="customer-login.html" style="color:var(--bone); text-decoration:underline;">Back to login</a>
    </div>

    <!-- back link -->
    <div style="margin-top:14px; text-align:center;">
      <a
        href="../index.html"
        style="font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
               letter-spacing:.07em; color:var(--smoke); transition:color .18s;"
        onmouseover="this.style.color='var(--bone)'"
        onmouseout="this.style.color='var(--smoke)'"
      >↗ Back to store</a>
    </div>

  </div>
</div>

<script src="../js/config.js"></script>
<script>
  const API = window.SOLTR_CONFIG.API;

  document.getElementById('forgotForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const email      = document.getElementById('forgotEmail').value.trim();
    const errorEl    = document.getElementById('forgotError');
    const successEl  = document.getElementById('successBanner');
    const submitBtn  = document.getElementById('submitBtn');
    const form       = document.getElementById('forgotForm');
    const card       = document.getElementById('loginCard');

    submitBtn.classList.add('loading');
    errorEl.classList.remove('show');

    try {
      const res  = await fetch(`${API}/customers/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));

      submitBtn.classList.remove('loading');

      /* Backend always returns the same generic message on 200,
         regardless of whether the account exists — shown as-is here,
         no branching on existence. */
      if (res.ok) {
        form.style.display = 'none';
        successEl.textContent = data.message || 'If an account with that email exists, a password reset link has been sent.';
        successEl.style.display = 'block';
      } else {
        errorEl.textContent = data.message || 'Something went wrong. Please try again.';
        errorEl.classList.add('show');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
    } catch (err) {
      submitBtn.classList.remove('loading');
      errorEl.textContent = 'Could not reach the server. Please try again.';
      errorEl.classList.add('show');
    }
  });
</script>
</body>
</html>
